<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <title>JukeBox GR4</title>
  <style>
    body { font-family: Arial; margin: 20px; }
    .kolonner { display: flex; gap: 10px; margin-top: 10px; }
    .kolonne { border: 3px solid green; padding: 10px; height: 450px; overflow-y: auto; }
    summary { cursor: pointer; font-weight: bold; }
    #besked { color: darkred; }
  </style>
</head>
<body>
  <h1>JukeBox GR4</h1>

  <input id="soegefelt" placeholder="Søg på sang, kunstner eller album">
  <select id="genreValg">
    <option value="">Alle genrer</option>
    <option>Rock</option>
    <option>Metal</option>
    <option>Pop</option>
    <option>Grunge</option>
    <option>Alternativ</option>
  </select>
  <p id="besked"></p>

  <div class="kolonner">
    <div class="kolonne">
      <button id="knapSange" onclick="visSange(sange)">Sange</button><br>
      <button id="knapAlbums" onclick="visAlbums()">Albums</button><br>
      <button id="knapKunstner" onclick="visKunstnere()">Kunstner</button><br>
      <button id="knapGenrer" onclick="visGenrer()">Genrer</button>
    </div>

    <div id="liste" class="kolonne" style="flex: 1"></div>

    <div class="kolonne" style="width: 320px">
      <h3 id="koeOverskrift">Kø (0/5)</h3>
      <button id="rydKoeKnap" onclick="rydKoe()">Ryd køen</button>
      <div id="koe"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
